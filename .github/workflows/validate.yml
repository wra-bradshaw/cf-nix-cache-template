name: Validate deployment template

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The publish workflow opens the release PR once npm serves the package,
      # and auto-merge depends on this job, so it must never pass by skipping.
      - name: Install the standalone template
        run: pnpm install --frozen-lockfile
      # `check` type-checks, dry-runs wrangler.jsonc, and dry-runs the rendered
      # config that `pnpm run deploy` actually deploys.
      - name: Type-check and dry-run the source and rendered configs
        run: pnpm run check
