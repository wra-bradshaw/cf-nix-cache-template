name: Validate deployment template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The publish workflow opens the release PR once npm serves the package,
      # and auto-merge depends on this job, so it must never pass by skipping.
      - name: Install the standalone template
        run: pnpm install --frozen-lockfile
      # The Wrangler dry-run needs no Cloudflare credentials, so forks pass too.
      - name: Type-check, validate and dry-run the config
        run: pnpm run check
